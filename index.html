<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product preview card component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="poster">
        <picture>
            <source media="(max-width: 768px)" srcset="images/image-product-mobile.jpg">
            <img src="images/image-product-desktop.jpg" alt="image-product-desktop">
        </picture>

        <div class="context">
            <p class="perfume">PERFUME</p>
            <h1>Gabrielle Essence Eau De Parfum</h1>
            <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
                Perfumer-Creator for the House
                of CHANEL</p>
            <div class="price">
                <h1>$149.99</h1>
                <p>$169.99</p>
            </div>
            <button>
                <img src="images/icon-cart.svg" alt="cart">
                <p>Add to Cart</p>
            </button>

        </div>


    </div>


</body>

</html>
